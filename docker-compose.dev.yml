services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: axiom
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: axiom_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://axiom:axiom_dev@db:5432/axiom?schema=public
      JWT_SECRET: axiom-dev-jwt-secret-change-in-production-must-be-32-chars
      JWT_REFRESH_SECRET: axiom-dev-refresh-secret-change-in-prod-32-chars-min
      PORT: 3000
      REPOS_PATH: /data/repos
      STORAGE_PATH: /data/uploads
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./.data/repos:/data/repos
      - ./.data/uploads:/data/uploads

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "7000:7000"
    environment:
      VITE_API_URL: http://api:3000
    depends_on:
      - api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7000/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
