x-app-dev: &app-dev
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: axiom-app-dev
  restart: unless-stopped
  environment: &app-dev-env
    DATABASE_URL: postgresql://axiom:axiom_dev@db:5432/axiom?schema=public
    JWT_SECRET: axiom-dev-jwt-secret-change-in-production-must-be-32-chars
    JWT_REFRESH_SECRET: axiom-dev-refresh-secret-change-in-prod-32-chars-min
    PORT: 3000
    STORAGE_PATH: /data/uploads
    NODE_ENV: development
    REDIS_URL: redis://:axiom_dev_redis@redis:6379
    SMTP_HOST: mailserver
    SMTP_PORT: 25
    SMTP_FROM: "Axiom <noreply@mail.axiom.local>"
    FRONTEND_URL: http://localhost:7000
  volumes: &app-dev-volumes
    - ./src:/app/src
    - ./prisma:/app/prisma
    - ./prisma.config.ts:/app/prisma.config.ts
    - ./scripts:/app/scripts
    - ./vitest.config.ts:/app/vitest.config.ts
    - ./package.json:/app/package.json
    - ./.data/uploads:/data/uploads

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: axiom
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: axiom_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "axiom_dev_redis"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "axiom_dev_redis", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    restart: unless-stopped
    hostname: mail.axiom.local
    environment:
      SMTP_ONLY: 1
      PERMIT_DOCKER: network
      OVERRIDE_HOSTNAME: mail.axiom.local
      ONE_DIR: 1
      ENABLE_SPAMASSASSIN: 0
      ENABLE_CLAMAV: 0
      ENABLE_FAIL2BAN: 0
      ENABLE_POSTGREY: 0
      SSL_TYPE:
      POSTFIX_INET_PROTOCOLS: ipv4
    volumes:
      - maildata:/var/lib/mail
      - mailstate:/var/mail-state
      - ./docker/mailserver/config/:/tmp/docker-mailserver/
    healthcheck:
      test: ["CMD-SHELL", "ss -tlnp | grep -q ':25 '"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  migrate:
    <<: *app-dev
    restart: "no"
    command: ["sh", "-c", "npx prisma generate && npx tsx src/migrate.ts"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app-dev
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app-dev
    command: ["sh", "-c", "npx prisma generate && npx tsx watch src/worker.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailserver:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      VITE_API_URL: http://api:3000
    depends_on:
      - api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7000"]
      interval: 30s
      timeout: 5s
      retries: 3

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://web:7000
    depends_on:
      - web
    profiles:
      - tunnel

volumes:
  pgdata:
  redis-data:
  maildata:
  mailstate:
