name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: axiom
          POSTGRES_PASSWORD: axiom_dev
          POSTGRES_DB: axiom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U axiom"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://axiom:axiom_dev@localhost:5432/axiom_test?schema=public
      JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-test-refresh-secret-must-be-at-least-32-chars
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Start Redis
        # Service containers cannot take a command, and the tests expect a password.
        run: docker run -d --name redis -p 6379:6379 redis:7-alpine redis-server --requirepass axiom_dev_redis

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to test database
        run: npx prisma db push

      - name: Typecheck backend
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Frontend typecheck
        run: cd frontend && npx tsc --noEmit

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
